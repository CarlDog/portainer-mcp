name: CodeQL

on:
  push:
    branches: [main]
  # Dependabot can upload CodeQL results on pull_request with its read-only token.
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 18 * * 1"

permissions: {}

jobs:
  analyze:
    # These names are required by main's branch protection.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Preserve default setup's remote_and_local threat model.
          config: |
            threat-models: [local]

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
          wait-for-processing: true
