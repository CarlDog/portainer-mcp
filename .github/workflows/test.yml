name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # node 22 ships npm 10.9.8. A newer local npm is lenient about a lockfile
  # this npm rejects, so pin both sides (here + package.json "packageManager")
  # to keep local == CI. See claude-fleet-kit fleet/lessons/npm-version-skew.
  PINNED_NPM: "11.19.0"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Pin npm (match local — see lessons/npm-version-skew)
        run: npm install --global "npm@${{ env.PINNED_NPM }}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  quality:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Pin npm (match local — see lessons/npm-version-skew)
        run: npm install --global "npm@${{ env.PINNED_NPM }}"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
