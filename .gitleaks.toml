title = "portainer-mcp gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Paths excluded from secret scanning"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)venv/''',
  '''(^|/)dist/''',
  # Pinned upstream OpenAPI spec snapshots. Contain example JWTs and
  # other illustrative secrets that ship with the upstream docs and
  # are intentionally synthetic / expired. Refresh process is
  # documented in docs/PORTAINER-API.md.
  '''(^|/)docs/specs/''',
]
